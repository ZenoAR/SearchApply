# Honest self-assessment of your CURRENT skill level.
# Separate from resume.yaml on purpose: resume.yaml is what you publicly claim,
# skills.yaml is the truth, so gap analysis tells you what to actually practice.
#
# level: one of learning | comfortable | confident
#   learning    - used it a little, or a while ago; would need to look things up
#   comfortable - can do real work with it unassisted, some edge cases might trip you up
#   confident   - could pass a live interview question on it without prep
#
# last_used: YYYY-MM, optional. Helps flag "confident but rusty" skills.
# category: language | framework | tool | domain | soft-skill (free-form, used by `report` later)

skills:
